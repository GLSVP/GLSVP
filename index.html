<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Site</title>
    <!-- Chargement de la feuille de style épurée -->
    <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>

    <!-- Boîte flottante de gestion des langues (Haut Droite) -->
    <div class="dropdown lang-floating-box">
        <button class="lang-link">🌐 Langues</button>
        <div class="dropdown-content">
            <a href="#" data-lang="en">GB English</a>
            <a href="#" data-lang="pt">BR Português</a>
            <a href="#" data-lang="fr">FR Français</a>
            <a href="#" data-lang="de">DE Deutsch</a>
            <a href="#" data-lang="es">ES Español</a>
            <a href="#" data-lang="nl">NL Nederlands</a>
        </div>
    </div>

    <!-- Boîte flottante de téléchargement du CV (Haut Gauche) -->
    <div class="dropdown cv-floating-box">
        <button class="btn-cv">
            <span data-translate="cv_btn">Knopf drücken</span>
        </button>
        <div class="dropdown-content">
            <a href="CV_GLSVP-fr.pdf" target="_blank">Version Française (PDF)</a>
            <a href="CV_GLSVP-en.pdf" target="_blank">English Version (PDF)</a>
            <a href="CV_GLSVP-fr_BL.pdf" target="_blank">BL Version (PDF)</a>
        </div>
    </div>

    <!-- En-tête Vidéo principal -->
    <header class="video-header">
        <video autoplay loop muted playsinline class="bg-video">
            <source src="Flamme.mp4" type="video/mp4">
        </video>
        <h1 data-translate="title">Bis zur Unendlichkeit und noch viel weiter</h1>
    </header>

    <!-- Premier Main : Diaporama et Illustration -->
    <main>
        <div class="bug-container" id="bg-slideshow">
            <div class="slideshow-layer active"></div>
            <div class="slideshow-layer"></div>
        </div>

        <div class="illustration-container">
            <img src="home.jpg" alt="Illustration professionnelle">
        </div>
    </main>

    <!-- Deuxième Main : Supplément Planisphère géré par le CSS -->
    <main></main>

    <!-- Sélecteur musical & Lecteur audio intégré -->
    <div class="choix-musique">
        <label for="select-audio">Musique :</label>
        <select id="select-audio"></select>
        
        <br>
        <audio id="fond-sonore" controls>
            <source id="audio-source" src="Vivaldi.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Pied de page avec arrière-plan vidéo -->
    <footer>
        <div class="footer-video-container">
            <video autoplay loop muted playsinline class="bg-video-footer">
                <source src="Videoalu.mp4" type="video/mp4">
            </video>
        </div>
        <div class="footer-content"></div>
    </footer>

    <!-- CHARGEMENT DES LOGIQUES -->
    <script src="images.js"></script>
    <script src="main.js"></script>
    <script>
        // Gestion propre de l'écouteur de traduction pour remplacer les anciens onclick
        document.querySelectorAll('[data-lang]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                if (typeof changeLanguage === 'function') {
                    changeLanguage(link.getAttribute('data-lang'));
                }
            });
        });
    </script>
</body>
</html>
